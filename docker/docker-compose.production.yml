services:

  database:
    image: postgres:16-alpine
    container_name: farmdirect-database
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - farmdirect


  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile

    image: farmdirect-backend:production

    container_name: farmdirect-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production

      PORT: 5000

      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      DB_SSL: "false"

    depends_on:
      database:
        condition: service_healthy

    ports:
      - "5000:5000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - farmdirect


  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile

    image: farmdirect-frontend:production

    container_name: farmdirect-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "8080:80"

    networks:
      - farmdirect


networks:
  farmdirect:
    driver: bridge


volumes:
  postgres_data: