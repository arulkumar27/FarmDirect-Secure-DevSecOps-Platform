apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-only-from-backend
  namespace: farmdirect

spec:
  podSelector:
    matchLabels:
      app: database

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5432